<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>María Luisa 70 años</title>

<style>
body {
  margin: 0;
  background: #000;
  font-family: Arial, sans-serif;
  color: white;
  text-align: center;
}

#videoPantalla {
  width: 100%;
  height: 100vh;
  object-fit: cover;
}

#botonEntrar {
  display: none;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: linear-gradient(45deg, #ff7b00, #ff00aa);
  color: white;
  padding: 18px 35px;
  border-radius: 40px;
  font-size: 22px;
  border: none;
  cursor: pointer;
}

#invitacion {
  display: none;
  padding: 40px 20px;
  background: linear-gradient(135deg, #6a0dad, #ff4da6);
  min-height: 100vh;
}

h1 {
  font-size: 45px;
}

.tarjeta {
  background: rgba(255,255,255,0.15);
  padding: 25px;
  border-radius: 20px;
  margin-top: 20px;
}
</style>

</head>

<body>

<video id="videoPantalla" autoplay muted>
  <source src="video.mp4" type="video/mp4">
</video>

<button id="botonEntrar" onclick="entrar()">
  ✨ Entrar a la invitación ✨
</button>


<div id="invitacion">

<h1>🪩 María Luisa 🪩</h1>

<h2>70 años de alegría y recuerdos</h2>

<div class="tarjeta">
<p>📅 Fecha: Próximamente</p>
<p>⏰ Hora: 2:00 p.m.</p>
<p>🎶 Fiesta estilo años 70</p>
<p>✨ Una tarde llena de música y diversión</p>
</div>

</div>


<script>

let video = document.getElementById("videoPantalla");
let boton = document.getElementById("botonEntrar");

video.onended = function(){
  video.style.display="none";
  boton.style.display="block";
}

function entrar(){
  boton.style.display="none";
  document.getElementById("invitacion").style.display="block";
}

</script>

</body>
</html>
