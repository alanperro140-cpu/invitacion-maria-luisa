<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación María Luisa</title>

  <style>
    body {
      margin: 0;
      font-family: "Georgia", serif;
      background: linear-gradient(135deg, #111, #5a3a1a);
      color: white;
      text-align: center;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .invitacion {
      background: rgba(0,0,0,0.75);
      padding: 40px;
      border-radius: 25px;
      max-width: 500px;
      box-shadow: 0 0 30px #d4af37;
      border: 2px solid #d4af37;
    }

    h1 {
      font-size: 55px;
      color: #d4af37;
      margin-bottom: 10px;
      letter-spacing: 3px;
    }

    h2 {
      font-size: 25px;
      font-weight: normal;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
    }

    button {
      background: #d4af37;
      color: black;
      border: none;
      padding: 15px 30px;
      border-radius: 30px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 20px;
    }

    button:hover {
      transform: scale(1.05);
    }

    .brillo {
      animation: brillo 2s infinite alternate;
    }

    @keyframes brillo {
      from {
        text-shadow: 0 0 5px #fff;
      }
      to {
        text-shadow: 0 0 25px #d4af37;
      }
    }
  </style>
</head>

<body>

<div class="invitacion">

  <h1 class="brillo">María Luisa</h1>

  <h2>✨ Estás invitado a una noche inolvidable ✨</h2>

  <p>
    Acompáñanos a celebrar un momento muy especial
    con una fiesta inspirada en los años 70.
  </p>

  <p>
    🕺 Música • ✨ Luces • 🎶 Diversión
  </p>

  <p>
    Próximamente más detalles...
  </p>

  <button onclick="alert('¡Gracias por confirmar tu asistencia!')">
    Confirmar asistencia
  </button>

</div>

</body>
</html>
